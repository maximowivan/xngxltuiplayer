name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $stage = "dist/stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$stage/xngxltuiplayer.exe" .
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }

          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, discord.example.json, install_xngxltuiplayer.ps1, install_xngxltuiplayer.bat, uninstall_xngxltuiplayer.ps1, uninstall_xngxltuiplayer.bat -Destination $stage
          New-Item -ItemType Directory -Path "$stage/assets" -Force | Out-Null
          Copy-Item assets/logo.png, assets/logo-256.png -Destination "$stage/assets"
          & "$stage/xngxltuiplayer.exe" --version

          $name = "xngxltuiplayer-v$version-windows-amd64.zip"
          $zip = Join-Path "dist" $name
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "dist/xngxltuiplayer-v$version-windows-amd64.zip"
          $notes = "release-notes/$version.md"
          $args = @(
            $env:GITHUB_REF_NAME,
            $zip,
            "$zip.sha256",
            "--title", "xngxltuiplayer $version",
            "--verify-tag"
          )
          if (Test-Path -LiteralPath $notes) {
            $args += @("--notes-file", $notes)
          } else {
            $args += "--generate-notes"
          }
          gh release create @args

  linux:
    needs: windows
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Test
        run: go test -count=1 ./...

      - name: Build Linux archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="dist/linux"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$stage/xngxltuiplayer" .
          cp README.md LICENSE THIRD_PARTY_NOTICES.md discord.example.json "$stage/"
          mkdir -p "$stage/assets"
          cp assets/logo.png "$stage/assets/"
          archive="$PWD/dist/xngxltuiplayer-v$version-linux-amd64.tar.gz"
          tar -C "$stage" -czf "$archive" \
            xngxltuiplayer README.md LICENSE THIRD_PARTY_NOTICES.md discord.example.json assets/logo.png
          cd dist
          sha256sum "xngxltuiplayer-v$version-linux-amd64.tar.gz" > "xngxltuiplayer-v$version-linux-amd64.tar.gz.sha256"
          ls -lh

      - name: Upload Linux asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/xngxltuiplayer-v$version-linux-amd64.tar.gz" \
            "dist/xngxltuiplayer-v$version-linux-amd64.tar.gz.sha256" \
            --clobber
