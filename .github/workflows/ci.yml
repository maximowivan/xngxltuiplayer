name: ci

on:
  push:
    branches: [dev, devdev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "These files are not gofmt-ed:"
            $files
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: Build Windows binary
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o xngxltuiplayer.exe .

  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: Build Linux binary
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o xngxltuiplayer .

      - name: Version
        run: ./xngxltuiplayer --version

      - name: Package Linux archive
        run: |
          set -euo pipefail
          stage="dist/linux"
          mkdir -p "$stage"
          cp xngxltuiplayer README.md LICENSE THIRD_PARTY_NOTICES.md discord.example.json "$stage/"
          tar -C "$stage" -czf "$PWD/dist/xngxltuiplayer-ci-linux-amd64.tar.gz" \
            xngxltuiplayer README.md LICENSE THIRD_PARTY_NOTICES.md discord.example.json
          cd dist
          sha256sum xngxltuiplayer-ci-linux-amd64.tar.gz > xngxltuiplayer-ci-linux-amd64.tar.gz.sha256
          ls -lh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xngxltuiplayer-linux-amd64
          path: |
            xngxltuiplayer
            dist/xngxltuiplayer-ci-linux-amd64.tar.gz
            dist/xngxltuiplayer-ci-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  vulncheck:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
