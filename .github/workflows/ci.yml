name: ci

on:
  push:
    branches: [dev, devdev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "These files are not gofmt-ed:"
            $files
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: Build Windows binary
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o xngxltuiplayer.exe .

  vulncheck:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
